# nfpm config for the standalone hesplay .deb — the LAN music player client on
# its own, for boxes with speakers (a headless Raspberry Pi) that don't need the
# full Hespera server install. build.sh sets ARCH/VERSION in the environment and
# stages the binary to dist/hesplay (nfpm expands ${ARCH}/${VERSION} but not
# contents.src globs, so the path is literal).
name: hesplay
arch: ${ARCH}
version: ${VERSION}
section: sound
priority: optional
maintainer: Dan <daniel@alexander4.org>
description: |
  hesplay — LAN music player for Hespera. Plays music from a Hespera server on
  this machine's speakers: albums, artists, playlists, and radio mixes, with the
  server's per-track volume leveling applied. Also generates ambient noise
  (brown/pink/white) on a schedule, as a sleep aid. Built for headless boxes.
# A playback engine is required: mpv (preferred — best headless behavior) or
# ffplay, which ships inside ffmpeg. apt installs mpv when neither is present.
depends:
  - mpv | ffmpeg
# sox provides `play`, which generates the ambient noise. Recommends rather than
# Depends: without it the package's primary job — playing music — is completely
# unaffected, and the noise feature degrades honestly (the CLI names the missing
# package, the phone remote hides the section rather than offering a control
# that can only fail). apt installs Recommends by default, so a normal install
# still gets it; only a deliberate --no-install-recommends opts out, and that
# user gets a clear message rather than a mystery. Same call as xdotool in the
# hespera package.
recommends:
  - sox
  # ffmpeg already appears as an alternative above, but apt satisfies that with
  # mpv alone. Blue, violet and velvet noise are generated by ffmpeg's anoisesrc
  # (no SoX version can synthesize them) and piped into sox for shaping, so
  # naming it here is what makes all seven colours work on a default install.
  # Without it the other four are unaffected and those three name the missing
  # package rather than failing obscurely.
  - ffmpeg
# hespera .debs before 0.39.4 shipped /usr/bin/hesplay themselves; Replaces lets
# this package take the file over cleanly on a box upgrading from one of those.
replaces:
  - hespera (<< 0.39.4)
contents:
  - src: dist/hesplay
    dst: /usr/bin/hesplay
    file_info:
      mode: 0755
  # Phone-remote unit — shipped inert (not enabled, no maintainer scripts, so the
  # package stays script-free); `systemctl enable --now hesplay@<user>` is the
  # opt-in. A template, so the instance name picks the account to run as — which
  # matters here because that account needs access to the sound card. Enabling it
  # is also what gives the box a noise SCHEDULE: the reconciler lives inside the
  # --listen process.
  - src: build/hesplay@.service
    dst: /usr/lib/systemd/system/hesplay@.service
    file_info:
      mode: 0644
  # Lazy-loaded bash completion (sources the current script from the binary on
  # first Tab, so it never drifts from the CLI). Verbs complete offline; album /
  # artist / song / mix / playlist names come live from the server.
  - src: build/hesplay.bash
    dst: /usr/share/bash-completion/completions/hesplay
    file_info:
      mode: 0644
  # hesplay is stdlib-only (no third-party Go modules), so the AGPL license
  # text is the whole copyright story.
  - src: LICENSE
    dst: /usr/share/doc/hesplay/copyright
    file_info:
      mode: 0644
