# nfpm config for the Hespera .deb. The build scripts set ARCH/VERSION in the
# environment and stage the binaries to dist/hespera and dist/hescli (nfpm
# expands ${ARCH}/${VERSION} but not contents.src globs, so those paths are
# literal). The hesplay music-player client ships as its OWN .deb
# (nfpm-hesplay.yaml) so client boxes don't need the full install — it must
# not also ship here (two packages owning /usr/bin/hesplay conflict).
# No service is ENABLED by default: Hespera is launched on demand as a desktop
# app (the .desktop entry below opens a chromeless window). An inert systemd
# template unit ships for headless boxes — `systemctl enable --now hespera@<user>`
# opts in; nothing runs until someone does.
name: hespera
arch: ${ARCH}
version: ${VERSION}
section: net
priority: optional
maintainer: Dan <daniel@alexander4.org>
description: |
  Hespera — a local app for your Music, TV, and Movies with automatic metadata
  matching. Launches a chromeless app window on your machine (loopback-only); a
  Docker server mode is also available.
# ffmpeg powers TV/movie transcoding + tag recovery. apt pulls it on install.
depends:
  - ffmpeg

# xdotool is optional: it lets the app window take the keyboard on launch under
# an X11 focus-follows-mouse window manager (browser.FocusWindow). Absent, the
# window simply relies on the WM — which is correct on every click-to-focus
# desktop, so this is a Recommends, not a Depends.
recommends:
  - xdotool
  # hesplay is a separate package (a client box installs it alone), but a box
  # running Hespera should get one too: it is what plays or generates audio on
  # THAT machine's own speakers, and it is what the home screen's Noise card
  # points at. Recommends rather than Depends — Hespera is a media server and
  # works fully without it — but apt installs Recommends by default, so a normal
  # install has one. Installing it starts nothing: the unit it ships is inert.
  #
  # This also stops a server deploy from REMOVING hesplay. Hespera .debs before
  # 0.39.4 shipped /usr/bin/hesplay themselves; since it moved to its own package
  # nothing declared the relationship, so the next `install.sh remote` would have
  # dropped it from a box that had it.
  - hesplay
contents:
  - src: dist/hespera
    dst: /usr/bin/hespera
    file_info:
      mode: 0755
  - src: dist/hescli
    dst: /usr/bin/hescli
    file_info:
      mode: 0755
  # Lazy-loaded bash completion for hescli (sources the current script from the
  # binary on first Tab, so it never drifts from the CLI).
  - src: build/hescli.bash
    dst: /usr/share/bash-completion/completions/hescli
    file_info:
      mode: 0644
  # Desktop launcher + icon so Hespera appears in the app menu and opens a
  # chromeless window. StartupWMClass=Hespera matches the --class the launcher
  # passes Chromium, so the panel shows this icon (see internal/browser).
  - src: build/hespera.desktop
    dst: /usr/share/applications/hespera.desktop
    file_info:
      mode: 0644
  - src: build/hespera.svg
    dst: /usr/share/icons/hicolor/scalable/apps/hespera.svg
    file_info:
      mode: 0644
  # Headless server unit — shipped inert (not enabled, no maintainer scripts, so
  # the package stays script-free); `systemctl enable --now hespera@<user>` is
  # the opt-in. A template, so the instance name picks the account to run as.
  - src: build/hespera@.service
    dst: /usr/lib/systemd/system/hespera@.service
    file_info:
      mode: 0644
  # License + third-party attribution (THIRD_PARTY_LICENSES.md is kept current by
  # TestThirdPartyLicensesCurrent).
  - src: LICENSE
    dst: /usr/share/doc/hespera/copyright
    file_info:
      mode: 0644
  - src: THIRD_PARTY_LICENSES.md
    dst: /usr/share/doc/hespera/THIRD_PARTY_LICENSES.md
  - src: third_party/licenses
    dst: /usr/share/doc/hespera/licenses
    file_info:
      mode: 0644
